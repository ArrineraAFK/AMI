<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AMI – Adopt Me Index</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="collections.css">
</head>
<body data-page="collections">

<header class="site-header">
  <div class="site-header-top">
    <button class="nav-toggle" onclick="toggleNavPanel()" title="Switch page">☰</button>
    <div class="site-title">
      <h1>AMI</h1>
      <p>Adopt Me Index</p>
    </div>
    <button class="dark-toggle" onclick="toggleDark()" id="dark-btn" title="Dark Mode">🌙</button>
  </div>
  <div class="global-progress"><div class="global-progress-bar" id="global-bar" style="width:0%"></div></div>
  <nav class="view-tabs">
    <button class="view-tab active" data-view="collections" onclick="switchView('collections')">Collections</button>
    <button class="view-tab" data-view="rarity" onclick="switchView('rarity')">Rarity</button>
    <button class="view-tab" data-view="alpha" onclick="switchView('alpha')">Alphabet</button>
    <button class="view-tab" data-view="owned" onclick="switchView('owned')">Collected</button>
  </nav>
  <div class="header-search-wrap" id="header-search-wrap">
    <div class="header-search-row">
      <div class="search-box" id="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Search collection or pet…" oninput="onSearchInput()" autocomplete="off" autocorrect="off" autocapitalize="off">
        <button class="clear-search" onclick="document.getElementById('search').value='';onSearchInput()">✖</button>
      </div>
    </div>
    <button class="search-toggle" id="search-toggle-btn" onclick="toggleSearchBar()" title="Toggle search & profile bar">
      <span class="chevron" id="search-toggle-chevron">▾</span>
    </button>
    <div class="top-bar" id="top-bar">
      <div class="profile-bar">
        <select class="profile-select" id="profile-select" onchange="switchProfile()"></select>
        <div class="profile-menu">
          <button class="profile-btn" onclick="toggleProfileMenu()" title="Profile options">☰</button>
          <div class="profile-dropdown" id="profile-dropdown">
            <button onclick="openRenameModal();closeProfileMenu()">✏️ Rename</button>
            <button onclick="openDeleteConfirm();closeProfileMenu()" class="danger">🗑 Delete</button>
          </div>
        </div>
        <button class="profile-btn" onclick="openNewProfileModal()" title="New profile">＋</button>
      </div>
      <div class="stat"><strong id="s-complete">0</strong>Complete</div>
      <div class="stat"><strong id="s-partial">0</strong>In Progress</div>
      <div class="stat"><strong id="s-total">0</strong>Collections</div>
      <div class="stat"><strong id="s-pets">0/0</strong>Pets</div>
    </div>
  </div>
</header>

<main class="main">
  <div class="controls">
    <select id="filter-status" onchange="renderCurrentView()" class="filter-status-sel">
      <option value="all">All Status</option>
      <option value="complete">Complete</option>
      <option value="partial">In Progress</option>
      <option value="empty">Not Started</option>
    </select>
    <select id="filter-type" onchange="renderCurrentView()" class="filter-type-sel">
      <option value="all">All Types</option>
      <option value="egg">Eggs</option>
      <option value="event">Events</option>
      <option value="shop">Shop</option>
      <option value="special">Special</option>
      <option value="lure">Lure</option>
    </select>
    <select id="col-sort" onchange="renderCollections()" class="col-sort-sel">
      <option value="default">Default Order</option>
      <option value="az">A–Z</option>
      <option value="progress-desc">Progress ↓</option>
      <option value="progress-asc">Progress ↑</option>
    </select>
    <button onclick="expandAll()" class="expand-btn">Expand All</button>
    <button onclick="collapseAll()" class="collapse-btn">Collapse All</button>
    <button onclick="openResetConfirm()" class="btn-danger">Reset</button>
    <button onclick="exportData()">⬇ Export</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    <button onclick="document.getElementById('import-file').click()">⬆ Import</button>
  </div>

  <div id="view-collections">
    <div class="grid" id="grid"><div class="no-results">⏳ Loading pet data…</div></div>
  </div>
  <div id="view-rarity" style="display:none">
    <div class="rarity-view" id="rarity-view"></div>
  </div>
  <div id="view-alpha" style="display:none">
    <div class="alpha-view" id="alpha-view"></div>
  </div>
  <div id="view-owned" style="display:none">
    <div class="rarity-view" id="owned-view"></div>
  </div>
</main>

<button class="scroll-top" id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div class="modal-overlay" id="modal-input">
  <div class="modal">
    <h2 id="modal-input-title">New Profile</h2>
    <input type="text" id="modal-input-field" placeholder="Profile name…" autocomplete="off">
    <div class="modal-btns">
      <button onclick="closeInputModal()">Cancel</button>
      <button class="btn-primary" onclick="confirmInputModal()">OK</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-confirm">
  <div class="modal">
    <h2 id="modal-confirm-title">Confirm</h2>
    <p id="modal-confirm-text"></p>
    <div class="modal-btns">
      <button onclick="closeConfirmModal()">Cancel</button>
      <button class="btn-danger-solid" id="modal-confirm-ok">OK</button>
    </div>
  </div>
</div>

<div class="nav-overlay" id="nav-overlay">
  <nav class="nav-panel" id="nav-panel"></nav>
</div>

<script src="shared.js"></script>
<script src="collections.js"></script>
</body>
</html>
